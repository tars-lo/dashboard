<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罫線 Keisen — Paper Templates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f3;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --border: #e0e0de;
            --accent: #2563eb;
            --grid-blue: #a8c5e2;
            --grid-red: #e2a8a8;
            --grid-gray: #c0c0c0;
            --paper-white: #ffffff;
            --paper-cream: #faf8f3;
            --paper-aged: #f0ebe0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 3rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        header h1 span {
            font-weight: 300;
            color: var(--text-muted);
            margin-left: 0.5rem;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .device-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .device-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .device-btn:hover {
            border-color: var(--accent);
        }

        .device-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .device-btn small {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        .orientation-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .orientation-btn {
            flex: 1;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .orientation-btn svg {
            width: 20px;
            height: 14px;
        }

        .orientation-btn[data-orientation="portrait"] svg {
            width: 14px;
            height: 20px;
        }

        .orientation-btn:hover {
            border-color: var(--accent);
        }

        .orientation-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .template-btn {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            transition: all 0.15s ease;
            padding: 0.5rem;
        }

        .template-btn:hover {
            border-color: var(--accent);
        }

        .template-btn.active {
            border-color: var(--accent);
            background: #eff6ff;
        }

        .template-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-muted);
        }

        .template-btn.active svg {
            stroke: var(--accent);
        }

        .template-btn span {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .template-btn.active span {
            color: var(--accent);
        }

        .color-options {
            display: flex;
            gap: 0.5rem;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: var(--text);
        }

        .color-btn.gray { background: #b4b4b4; }
        .color-btn.blue { background: #a8c5e2; }
        .color-btn.red { background: #d2a0a0; }
        .color-btn.tomoe { background: #a0b4c8; }

        .paper-options {
            display: flex;
            gap: 0.5rem;
        }

        .paper-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .paper-btn::before {
            content: '';
            display: block;
            width: 100%;
            height: 20px;
            border-radius: 3px;
            margin-bottom: 0.5rem;
        }

        .paper-btn.white::before { background: #ffffff; border: 1px solid var(--border); }
        .paper-btn.cream::before { background: #fcfaf5; border: 1px solid #e8e4d9; }
        .paper-btn.tomoe-paper::before { background: #fffefa; border: 1px solid #e8e6e0; }

        .paper-btn:hover {
            border-color: var(--accent);
        }

        .paper-btn.active {
            border-color: var(--accent);
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-row label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .control-row input[type="number"] {
            width: 70px;
            padding: 0.4rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.8rem;
            text-align: right;
        }

        .control-row input[type="range"] {
            width: 120px;
        }

        .control-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .export-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: auto;
        }

        .export-btn:hover {
            background: #1d4ed8;
        }

        .preview-area {
            flex: 1;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .preview-container {
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        #preview {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            header {
                padding: 1rem 1.25rem;
            }

            header h1 {
                font-size: 1.2rem;
            }

            header h1 span {
                display: block;
                margin-left: 0;
                margin-top: 0.25rem;
                font-size: 0.85rem;
            }

            .container {
                flex-direction: column;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 1rem;
                gap: 1rem;
                max-height: none;
                overflow: visible;
            }

            .device-buttons {
                flex-direction: column;
            }

            .device-btn {
                padding: 0.6rem 0.75rem;
            }

            .device-btn small {
                display: inline;
                margin-left: 0.5rem;
                margin-top: 0;
            }

            .template-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 0.4rem;
            }

            .template-btn {
                aspect-ratio: 1;
                padding: 0.35rem;
            }

            .template-btn svg {
                width: 20px;
                height: 20px;
            }

            .template-btn span {
                font-size: 0.55rem;
            }

            .section-title {
                font-size: 0.65rem;
            }

            .control-row {
                font-size: 0.8rem;
            }

            .control-row input[type="number"] {
                width: 60px;
                padding: 0.35rem;
            }

            .preview-area {
                padding: 1rem;
                min-height: auto;
                overflow: auto;
                align-items: flex-start;
                justify-content: flex-start;
            }

            .preview-container {
                flex-shrink: 0;
            }

            #preview {
                /* Don't distort - show at natural size, allow scroll */
                max-width: none;
            }

            .export-btn {
                padding: 0.85rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .template-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .color-options, .paper-options {
                flex-wrap: wrap;
            }

            .paper-btn {
                flex: 1 1 30%;
                font-size: 0.7rem;
            }
        }

        /* Subtle paper texture overlay */
        .paper-texture {
            position: relative;
        }

        .paper-texture::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <header>
        <h1>罫線<span>Keisen — Paper Templates</span></h1>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="section">
                <div class="section-title">Device</div>
                <div class="device-buttons">
                    <button class="device-btn active" data-device="remarkable">
                        reMarkable
                        <small>1696 × 954</small>
                    </button>
                    <button class="device-btn" data-device="ipad">
                        iPad Pro 13"
                        <small>2752 × 2064</small>
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Orientation</div>
                <div class="orientation-buttons">
                    <button class="orientation-btn active" data-orientation="landscape">
                        <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="1" y="1" width="22" height="14" rx="2"/>
                        </svg>
                        Landscape
                    </button>
                    <button class="orientation-btn" data-orientation="portrait">
                        <svg viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="1" y="1" width="14" height="22" rx="2"/>
                        </svg>
                        Portrait
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Template</div>
                <div class="template-grid">
                    <button class="template-btn active" data-template="grid">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                        </svg>
                        <span>Grid</span>
                    </button>
                    <button class="template-btn" data-template="dot">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <circle cx="6" cy="6" r="1" fill="currentColor"/>
                            <circle cx="12" cy="6" r="1" fill="currentColor"/>
                            <circle cx="18" cy="6" r="1" fill="currentColor"/>
                            <circle cx="6" cy="12" r="1" fill="currentColor"/>
                            <circle cx="12" cy="12" r="1" fill="currentColor"/>
                            <circle cx="18" cy="12" r="1" fill="currentColor"/>
                            <circle cx="6" cy="18" r="1" fill="currentColor"/>
                            <circle cx="12" cy="18" r="1" fill="currentColor"/>
                            <circle cx="18" cy="18" r="1" fill="currentColor"/>
                        </svg>
                        <span>Dot</span>
                    </button>
                    <button class="template-btn" data-template="lined">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                            <line x1="3" y1="14" x2="21" y2="14"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                        <span>Lined</span>
                    </button>
                    <button class="template-btn" data-template="cornell">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="9" y1="3" x2="9" y2="17"/>
                            <line x1="3" y1="17" x2="21" y2="17"/>
                        </svg>
                        <span>Cornell</span>
                    </button>
                    <button class="template-btn" data-template="calligraphy-cn">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="12" y1="3" x2="12" y2="21"/>
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="3" x2="21" y2="21"/>
                            <line x1="21" y1="3" x2="3" y2="21"/>
                        </svg>
                        <span>米字格</span>
                    </button>
                    <button class="template-btn" data-template="hobonichi">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="7" y1="3" x2="7" y2="21"/>
                            <line x1="7" y1="7" x2="21" y2="7"/>
                            <line x1="7" y1="11" x2="21" y2="11"/>
                            <line x1="7" y1="15" x2="21" y2="15"/>
                            <line x1="7" y1="19" x2="21" y2="19"/>
                            <text x="4" y="8" font-size="3" fill="currentColor">0</text>
                            <text x="4" y="12" font-size="3" fill="currentColor">1</text>
                        </svg>
                        <span>Hobonichi</span>
                    </button>
                    <button class="template-btn" data-template="genkoyoshi">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <line x1="7" y1="3" x2="7" y2="21"/>
                            <line x1="11" y1="3" x2="11" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                            <line x1="19" y1="3" x2="19" y2="21"/>
                            <line x1="3" y1="7" x2="21" y2="7"/>
                            <line x1="3" y1="11" x2="21" y2="11"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                            <line x1="3" y1="19" x2="21" y2="19"/>
                        </svg>
                        <span>原稿用紙</span>
                    </button>
                    <button class="template-btn" data-template="blank">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                        </svg>
                        <span>Blank</span>
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Ink</div>
                <div class="color-options">
                    <button class="color-btn gray active" data-color="gray" title="Gray"></button>
                    <button class="color-btn blue" data-color="blue" title="Blue"></button>
                    <button class="color-btn red" data-color="red" title="Red"></button>
                    <button class="color-btn tomoe" data-color="tomoe" title="Tomoe"></button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Paper</div>
                <div class="paper-options">
                    <button class="paper-btn white active" data-paper="white">White</button>
                    <button class="paper-btn cream" data-paper="cream">Cream</button>
                    <button class="paper-btn tomoe-paper" data-paper="tomoe">Tomoe</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Settings</div>
                <div class="control-row">
                    <label>Cell Size (mm)</label>
                    <input type="number" id="cellSize" value="5" min="2" max="20" step="0.5">
                </div>
                <div class="control-row">
                    <label>Line Weight</label>
                    <input type="range" id="lineWeight" value="0.3" min="0.1" max="1" step="0.1">
                </div>
                <div class="control-row">
                    <label>Margin (mm)</label>
                    <input type="number" id="margin" value="10" min="0" max="30" step="1">
                </div>
                <div class="control-row">
                    <label>Date / Subject Header</label>
                    <input type="checkbox" id="showHeader">
                </div>
            </div>

            <button class="export-btn" id="exportBtn">Export PDF</button>
        </aside>

        <main class="preview-area">
            <div class="preview-container paper-texture">
                <canvas id="preview"></canvas>
            </div>
        </main>
    </div>

    <script src="keisen.js?v=12"></script>
</body>
</html>
