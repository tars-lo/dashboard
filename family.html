<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lo Home">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <title>Lo Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap');
        
        :root {
            --bg: #fef9f5;
            --card: #ffffff;
            --text: #4a4a4a;
            --muted: #888;
            --blush: #e8b4b8;
            --blush-light: #fdf2f3;
            --sage: #9cb99c;
            --sage-light: #eef4ee;
            --honey: #d4a96a;
            --honey-light: #faf3e8;
            --lavender: #d4c4e8;
            --lavender-light: #f5f0fa;
            --border: #e8e2dc;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        /* ===== CONTENT AREA ===== */
        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        .tab-pane {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            background: var(--bg);
        }
        
        .tab-pane.active {
            display: flex;
            flex-direction: column;
        }
        
        .tab-pane iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
        
        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--muted);
        }
        
        .loading-icon {
            font-size: 40px;
            margin-bottom: 12px;
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .loading-text {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 14px;
            font-style: italic;
        }
        
        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 6px 0 max(6px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 10;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        
        .tab-icon {
            font-size: 24px;
            margin-bottom: 3px;
            transition: transform 0.2s;
        }
        
        .tab.active .tab-icon {
            transform: scale(1.15);
        }
        
        .tab-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--muted);
            transition: color 0.2s;
        }
        
        /* Active states with color accents */
        .tab[data-tab="dashboard"].active .tab-label { color: var(--blush); }
        .tab[data-tab="lily"].active .tab-label { color: var(--sage); }
        .tab[data-tab="family"].active .tab-label { color: var(--honey); }
        
        /* Active indicator dot */
        .tab::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        
        .tab[data-tab="dashboard"].active::after { background: var(--blush); transform: translateX(-50%) scale(1); }
        .tab[data-tab="lily"].active::after { background: var(--sage); transform: translateX(-50%) scale(1); }
        .tab[data-tab="family"].active::after { background: var(--honey); transform: translateX(-50%) scale(1); }
    </style>
</head>
<body>
    <!-- Content Area -->
    <div class="content">
        <div class="tab-pane active" data-pane="dashboard">
            <div class="loading">
                <div class="loading-icon">📋</div>
                <div class="loading-text">Loading dashboard...</div>
            </div>
            <iframe src="kristen.html" onload="this.previousElementSibling.style.display='none'"></iframe>
        </div>
        
        <div class="tab-pane" data-pane="lily">
            <div class="loading">
                <div class="loading-icon">🍼</div>
                <div class="loading-text">Loading Lily's Kitchen...</div>
            </div>
            <iframe data-src="https://tars-lo.github.io/lily-recipes/"></iframe>
        </div>
        
        <div class="tab-pane" data-pane="family">
            <div class="loading">
                <div class="loading-icon">🍳</div>
                <div class="loading-text">Loading family recipes...</div>
            </div>
            <iframe data-src="recipes.html"></iframe>
        </div>
    </div>
    
    <!-- Tab Bar -->
    <nav class="tab-bar">
        <div class="tab active" data-tab="dashboard">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Dashboard</span>
        </div>
        <div class="tab" data-tab="lily">
            <span class="tab-icon">🍼</span>
            <span class="tab-label">Lily</span>
        </div>
        <div class="tab" data-tab="family">
            <span class="tab-icon">🍳</span>
            <span class="tab-label">Family</span>
        </div>
    </nav>
    
    <script>
        (function() {
            var tabs = document.querySelectorAll('.tab');
            var panes = document.querySelectorAll('.tab-pane');
            
            function loadPane(paneName) {
                var pane = document.querySelector('[data-pane="' + paneName + '"]');
                var iframe = pane.querySelector('iframe');
                if (iframe.dataset.src && !iframe.src) {
                    iframe.src = iframe.dataset.src;
                    iframe.onload = function() {
                        var loading = pane.querySelector('.loading');
                        if (loading) loading.style.display = 'none';
                    };
                }
            }
            
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var targetTab = this.dataset.tab;
                    
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    
                    panes.forEach(function(p) { p.classList.remove('active'); });
                    var targetPane = document.querySelector('[data-pane="' + targetTab + '"]');
                    targetPane.classList.add('active');
                    
                    loadPane(targetTab);
                });
            });
        })();
    </script>
</body>
</html>
