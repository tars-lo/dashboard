<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TARS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1a1a1a;
      --border: #2a2a2a;
      --text: #fafafa;
      --text-dim: #888;
      --accent: #ff6b35;
      --accent-dim: rgba(255,107,53,0.15);
      --q1: #ff4444;
      --q1-dim: rgba(255,68,68,0.12);
      --q2: #ff6b35;
      --q2-dim: rgba(255,107,53,0.12);
      --q3: #4488ff;
      --q3-dim: rgba(68,136,255,0.12);
      --q4: #666;
      --q4-dim: rgba(102,102,102,0.12);
      --success: #00ff88;
      --warning: #ffcc00;
    }
    .light {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --surface2: #fafafa;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-dim: #666;
      --q1-dim: rgba(255,68,68,0.08);
      --q2-dim: rgba(255,107,53,0.08);
      --q3-dim: rgba(68,136,255,0.08);
      --q4-dim: rgba(102,102,102,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      transition: background 0.3s, color 0.3s;
    }
    .container { max-width: 540px; margin: 0 auto; }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .mode-toggle {
      width: 40px;
      height: 22px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .mode-toggle::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      transition: all 0.2s;
    }
    .light .mode-toggle::after {
      left: 21px;
      background: #fbbf24;
    }
    
    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .weather-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Mono', monospace;
    }
    .weather-icon { font-size: 1.3rem; }
    .weather-temp { font-size: 1rem; font-weight: 700; }
    .status-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }
    .status-location {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .status-time {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-left: auto;
    }
    
    /* Alert strip */
    .alert-strip {
      background: var(--accent-dim);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 10px;
      border-radius: 0 6px 6px 0;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-strip.warning {
      border-left-color: var(--warning);
      background: rgba(251,191,36,0.12);
    }
    .alert-strip.urgent {
      border-left-color: var(--q1);
      background: var(--q1-dim);
    }
    .alert-icon { font-size: 1rem; }
    .alert-text { flex: 1; }
    .alert-text strong { 
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
    }
    
    /* Cards */
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card-header {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 8px 12px;
      background: var(--surface2);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-badge {
      font-size: 0.6rem;
      padding: 2px 6px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 3px;
    }
    .card-body { padding: 10px 12px; }
    
    /* Events */
    .event {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.85rem;
    }
    .event:last-child { border-bottom: none; }
    .event.past { opacity: 0.4; }
    .event.now { 
      background: var(--accent-dim);
      margin: 0 -12px;
      padding: 8px 12px;
      border-radius: 4px;
      border-bottom: none;
    }
    .event-time {
      font-family: 'Space Mono', monospace;
      width: 65px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
    }
    .event.past .event-time { color: var(--text-dim); }
    .event-content { flex: 1; min-width: 0; }
    .event-title { 
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .event-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event-meta {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      border: 1px solid currentColor;
    }
    .tag-f { color: #ff69b4; }
    .tag-w { color: #4488ff; }
    .tag-t { color: var(--success); }
    .now-badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 1px 5px;
      background: var(--accent);
      color: white;
      border-radius: 2px;
    }
    
    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 10px 0 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }
    
    /* Eisenhower Matrix */
    .matrix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 8px;
    }
    .matrix-quadrant {
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      min-height: 100px;
      max-height: 180px;
      overflow-y: auto;
    }
    .matrix-quadrant.q1 { border-color: var(--q1); background: var(--q1-dim); }
    .matrix-quadrant.q2 { border-color: var(--q2); background: var(--q2-dim); }
    .matrix-quadrant.q3 { border-color: var(--q3); background: var(--q3-dim); }
    .matrix-quadrant.q4 { border-color: var(--q4); background: var(--q4-dim); }
    
    .matrix-header {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .matrix-quadrant.q1 .matrix-header { color: var(--q1); }
    .matrix-quadrant.q2 .matrix-header { color: var(--q2); }
    .matrix-quadrant.q3 .matrix-header { color: var(--q3); }
    .matrix-quadrant.q4 .matrix-header { color: var(--q4); }
    
    .matrix-task {
      background: var(--surface);
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    .matrix-task:last-child { margin-bottom: 0; }
    .matrix-task-title {
      line-height: 1.3;
    }
    .matrix-task-meta {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .matrix-empty {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }
    
    /* Axis labels */
    .matrix-wrapper { position: relative; }
    .matrix-axis-top {
      display: flex;
      justify-content: space-around;
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      padding: 0 20px;
    }
    .matrix-axis-left {
      position: absolute;
      left: -8px;
      top: 50%;
      transform: rotate(-90deg) translateX(-50%);
      transform-origin: left center;
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    
    /* Footer */
    .footer {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
    }
    
    .empty { 
      color: var(--text-dim); 
      font-style: italic; 
      font-size: 0.8rem;
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">◉</div>
        TARS_
      </div>
      <div class="header-right">
        <div class="date-label" id="currentDate">Loading...</div>
        <div class="mode-toggle" onclick="toggleMode()"></div>
      </div>
    </div>
    
    <div class="status-bar">
      <div class="weather-compact" id="weather">
        <span class="weather-icon">--</span>
        <span class="weather-temp">--°</span>
      </div>
      <div class="status-divider"></div>
      <div class="status-location" id="location">Singapore</div>
      <div class="status-time" id="statusTime">--:--</div>
    </div>
    
    <div id="alerts"></div>
    
    <div class="card">
      <div class="card-header">
        <span>📅 Schedule</span>
        <span class="card-badge" id="eventCount">--</span>
      </div>
      <div class="card-body">
        <div id="todayEvents">Loading...</div>
        <div class="section-label">Tomorrow</div>
        <div id="tomorrowEvents">Loading...</div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">
        <span>✓ Eisenhower Matrix</span>
      </div>
      <div class="card-body">
        <div class="matrix-wrapper">
          <div class="matrix-axis-top">
            <span>Urgent</span>
            <span>Not Urgent</span>
          </div>
          <div class="matrix" id="matrix">
            <div class="matrix-quadrant q1">
              <div class="matrix-header">🔥 Do Now</div>
              <div class="matrix-tasks" id="q1-tasks"></div>
            </div>
            <div class="matrix-quadrant q2">
              <div class="matrix-header">📅 Schedule</div>
              <div class="matrix-tasks" id="q2-tasks"></div>
            </div>
            <div class="matrix-quadrant q3">
              <div class="matrix-header">⚡ Delegate</div>
              <div class="matrix-tasks" id="q3-tasks"></div>
            </div>
            <div class="matrix-quadrant q4">
              <div class="matrix-header">🗑️ Drop</div>
              <div class="matrix-tasks" id="q4-tasks"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      ↻ <span id="lastUpdated">--</span> · TARS × TE
    </div>
  </div>

  <script>
    function toggleMode() {
      document.body.classList.toggle('light');
      localStorage.setItem('mode', document.body.classList.contains('light') ? 'light' : 'dark');
    }
    
    function autoMode() {
      const hour = new Date().getHours();
      const saved = localStorage.getItem('mode');
      if (saved) {
        if (saved === 'light') document.body.classList.add('light');
      } else {
        if (hour >= 6 && hour < 18) document.body.classList.add('light');
      }
    }
    autoMode();
    
    function updateClock() {
      const now = new Date();
      document.getElementById('statusTime').textContent = 
        now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
    updateClock();
    setInterval(updateClock, 60000);
    
    function parseTime(timeStr) {
      if (!timeStr || timeStr === 'All day') return null;
      const match = timeStr.match(/(\d+):(\d+)(am|pm)/i);
      if (!match) return null;
      let h = parseInt(match[1]);
      const m = parseInt(match[2]);
      if (match[3].toLowerCase() === 'pm' && h !== 12) h += 12;
      if (match[3].toLowerCase() === 'am' && h === 12) h = 0;
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }
    
    function isEventNow(timeStr) {
      const start = parseTime(timeStr.split('-')[0]);
      if (!start) return false;
      const endStr = timeStr.split('-')[1];
      const end = endStr ? parseTime(endStr) : new Date(start.getTime() + 60*60*1000);
      const now = new Date();
      return now >= start && now <= end;
    }
    
    function isEventPast(timeStr) {
      const parts = timeStr.split('-');
      const endTime = parseTime(parts[1] || parts[0]);
      if (!endTime) return false;
      return new Date() > endTime;
    }
    
    async function loadDashboard() {
      try {
        const res = await fetch('data.json?' + Date.now());
        const data = await res.json();
        
        document.getElementById('currentDate').textContent = data.date;
        document.getElementById('lastUpdated').textContent = data.updated;
        if (data.location) document.getElementById('location').textContent = data.location;
        
        // Weather
        document.getElementById('weather').innerHTML = `
          <span class="weather-icon">${data.weather.icon}</span>
          <span class="weather-temp">${data.weather.temp}°</span>
        `;
        
        // Alerts
        const alertsEl = document.getElementById('alerts');
        alertsEl.innerHTML = '';
        if (data.alerts && data.alerts.length > 0) {
          data.alerts.forEach(a => {
            alertsEl.innerHTML += `
              <div class="alert-strip ${a.type || ''}">
                <span class="alert-icon">${a.icon || '📍'}</span>
                <span class="alert-text"><strong>${a.title}</strong> ${a.body}</span>
              </div>
            `;
          });
        }
        
        // Today events
        const todayEl = document.getElementById('todayEvents');
        let eventCount = 0;
        if (!data.today || data.today.length === 0) {
          todayEl.innerHTML = '<div class="empty">Clear schedule</div>';
        } else {
          eventCount = data.today.length;
          todayEl.innerHTML = data.today.map(e => {
            const isNow = isEventNow(e.time);
            const isPast = !isNow && isEventPast(e.time);
            const cls = isNow ? 'now' : (isPast ? 'past' : '');
            let meta = '';
            if (e.location || e.attendees) {
              const parts = [];
              if (e.location) parts.push('📍 ' + e.location);
              if (e.attendees) parts.push('👥 ' + e.attendees);
              meta = `<div class="event-meta">${parts.join(' · ')}</div>`;
            }
            return `
              <div class="event ${cls}">
                <div class="event-time">${e.time}</div>
                <div class="event-content">
                  <div class="event-title">
                    <span class="event-title-text">${e.title}</span>
                    <span class="tag tag-${e.tag.toLowerCase()}">${e.tag}</span>
                    ${isNow ? '<span class="now-badge">Now</span>' : ''}
                  </div>
                  ${meta}
                </div>
              </div>
            `;
          }).join('');
        }
        
        // Tomorrow
        const tmrwEl = document.getElementById('tomorrowEvents');
        if (!data.tomorrow || data.tomorrow.length === 0) {
          tmrwEl.innerHTML = '<div class="empty">Clear schedule</div>';
        } else {
          eventCount += data.tomorrow.length;
          tmrwEl.innerHTML = data.tomorrow.map(e => {
            let meta = '';
            if (e.location || e.attendees) {
              const parts = [];
              if (e.location) parts.push('📍 ' + e.location);
              if (e.attendees) parts.push('👥 ' + e.attendees);
              meta = `<div class="event-meta">${parts.join(' · ')}</div>`;
            }
            return `
              <div class="event">
                <div class="event-time">${e.time}</div>
                <div class="event-content">
                  <div class="event-title">
                    <span class="event-title-text">${e.title}</span>
                    <span class="tag tag-${e.tag.toLowerCase()}">${e.tag}</span>
                  </div>
                  ${meta}
                </div>
              </div>
            `;
          }).join('');
        }
        document.getElementById('eventCount').textContent = eventCount + ' events';
        
        // Eisenhower Matrix
        const renderTasks = (tasks) => {
          if (!tasks || tasks.length === 0) return '<div class="matrix-empty">—</div>';
          return tasks.map(t => `
            <div class="matrix-task">
              <div class="matrix-task-title">${t.title}</div>
              ${t.meta ? `<div class="matrix-task-meta">${t.meta}</div>` : ''}
            </div>
          `).join('');
        };
        
        const tasks = data.tasks || [];
        document.getElementById('q1-tasks').innerHTML = renderTasks(tasks.filter(t => t.priority === 'q1'));
        document.getElementById('q2-tasks').innerHTML = renderTasks(tasks.filter(t => t.priority === 'q2'));
        document.getElementById('q3-tasks').innerHTML = renderTasks(tasks.filter(t => t.priority === 'q3'));
        document.getElementById('q4-tasks').innerHTML = renderTasks(tasks.filter(t => t.priority === 'q4'));
        
      } catch (e) {
        console.error('Load failed:', e);
      }
    }
    
    loadDashboard();
    setInterval(loadDashboard, 5 * 60 * 1000);
  </script>
</body>
</html>
