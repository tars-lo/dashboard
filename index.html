<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TARS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e4e4e7;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #374151;
    }
    .header h1 { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header .meta { text-align: right; }
    .header .date { color: #9ca3af; font-size: 0.9rem; }
    .header .updated { color: #6b7280; font-size: 0.75rem; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .card.full { grid-column: 1 / -1; }
    .event {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.9rem;
    }
    .event:last-child { border-bottom: none; }
    .event-time {
      width: 85px;
      color: #60a5fa;
      font-weight: 500;
      font-size: 0.85rem;
    }
    .event-title { flex: 1; }
    .tag {
      font-size: 0.65rem;
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: 6px;
      font-weight: 500;
    }
    .tag-f { background: rgba(236,72,153,0.15); color: #f472b6; }
    .tag-w { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .tag-t { background: rgba(74,222,128,0.15); color: #4ade80; }
    .task {
      display: flex;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .task:last-child { border-bottom: none; }
    .task-bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 12px;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .q1 .task-bullet { background: #ef4444; }
    .q2 .task-bullet { background: #f59e0b; }
    .q3 .task-bullet { background: #3b82f6; }
    .task-content { flex: 1; }
    .task-title { font-size: 0.9rem; }
    .task-meta { font-size: 0.75rem; color: #6b7280; margin-top: 3px; }
    .weather {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .weather-icon { font-size: 2.5rem; }
    .weather-temp { font-size: 2rem; font-weight: 300; }
    .weather-desc { color: #9ca3af; font-size: 0.85rem; }
    .callout {
      background: rgba(251,191,36,0.1);
      border-left: 3px solid #fbbf24;
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .callout-title { font-weight: 600; color: #fbbf24; font-size: 0.8rem; margin-bottom: 4px; }
    .section-tomorrow { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
    .section-tomorrow h3 { font-size: 0.75rem; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .empty { color: #6b7280; font-style: italic; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Dashboard</h1>
      <div class="meta">
        <div class="date" id="currentDate">Loading...</div>
        <div class="updated" id="lastUpdated"></div>
      </div>
    </div>
    
    <div class="grid">
      <div class="card">
        <h2>📅 Today</h2>
        <div id="todayEvents">Loading...</div>
        <div class="section-tomorrow">
          <h3>Tomorrow</h3>
          <div id="tomorrowEvents">Loading...</div>
        </div>
      </div>
      
      <div class="card">
        <h2>🌤️ Singapore</h2>
        <div class="weather" id="weather">
          <div class="weather-icon">☁️</div>
          <div>
            <div class="weather-temp">--°</div>
            <div class="weather-desc">Loading...</div>
          </div>
        </div>
      </div>
      
      <div class="card full">
        <h2>✅ This Week</h2>
        <div id="tasks">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // Data loaded from data.json
    async function loadDashboard() {
      try {
        const res = await fetch('data.json?' + Date.now());
        const data = await res.json();
        
        // Update date
        document.getElementById('currentDate').textContent = data.date;
        document.getElementById('lastUpdated').textContent = 'Updated ' + data.updated;
        
        // Today events
        const todayEl = document.getElementById('todayEvents');
        if (data.today.length === 0) {
          todayEl.innerHTML = '<div class="empty">No events</div>';
        } else {
          todayEl.innerHTML = data.today.map(e => `
            <div class="event">
              <div class="event-time">${e.time}</div>
              <div class="event-title">${e.title}<span class="tag tag-${e.tag.toLowerCase()}">${e.tag}</span></div>
            </div>
          `).join('');
        }
        
        // Tomorrow events
        const tmrwEl = document.getElementById('tomorrowEvents');
        if (data.tomorrow.length === 0) {
          tmrwEl.innerHTML = '<div class="empty">No events</div>';
        } else {
          tmrwEl.innerHTML = data.tomorrow.map(e => `
            <div class="event">
              <div class="event-time">${e.time}</div>
              <div class="event-title">${e.title}<span class="tag tag-${e.tag.toLowerCase()}">${e.tag}</span></div>
            </div>
          `).join('');
        }
        
        // Callout
        if (data.callout) {
          const calloutHtml = `<div class="callout"><div class="callout-title">${data.callout.title}</div>${data.callout.body}</div>`;
          todayEl.insertAdjacentHTML('beforeend', calloutHtml);
        }
        
        // Weather
        document.getElementById('weather').innerHTML = `
          <div class="weather-icon">${data.weather.icon}</div>
          <div>
            <div class="weather-temp">${data.weather.temp}°</div>
            <div class="weather-desc">${data.weather.desc}</div>
          </div>
        `;
        
        // Tasks
        const tasksEl = document.getElementById('tasks');
        if (data.tasks.length === 0) {
          tasksEl.innerHTML = '<div class="empty">No tasks</div>';
        } else {
          tasksEl.innerHTML = data.tasks.map(t => `
            <div class="task ${t.priority}">
              <div class="task-bullet"></div>
              <div class="task-content">
                <div class="task-title">${t.title}</div>
                <div class="task-meta">${t.meta}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error('Failed to load dashboard:', e);
      }
    }
    
    loadDashboard();
    // Auto-refresh every 5 minutes
    setInterval(loadDashboard, 5 * 60 * 1000);
  </script>
</body>
</html>
