<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lo Home">
    <title>Lo Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #1a1a1a;
            --warm-gray: #f7f6f3;
            --mid-gray: #888;
            --accent: #c4a77d;
            --rule: #e0ded9;
            --tab-bg: #ffffff;
            --tab-active: var(--accent);
            --blush: #e8b4b8;
            --sage: #9cb99c;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--warm-gray);
            color: var(--black);
            display: flex;
            flex-direction: column;
        }
        
        /* ===== CONTENT AREA ===== */
        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        .tab-pane {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        .tab-pane iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            background: var(--tab-bg);
            border-top: 1px solid var(--rule);
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 10;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--mid-gray);
            -webkit-tap-highlight-color: transparent;
        }
        
        .tab.active {
            color: var(--black);
        }
        
        .tab-icon {
            font-size: 22px;
            margin-bottom: 2px;
            transition: transform 0.2s;
        }
        
        .tab.active .tab-icon {
            transform: scale(1.1);
        }
        
        .tab-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        
        /* Tab indicator */
        .tab.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: calc(var(--tab-index) * 33.33% + 16.67% - 20px);
            width: 40px;
            height: 3px;
            background: var(--accent);
            border-radius: 0 0 3px 3px;
            transition: left 0.25s ease;
        }
        
        /* Color accents for each tab */
        .tab[data-tab="dashboard"].active { color: var(--black); }
        .tab[data-tab="lily"].active { color: #e8b4b8; }
        .tab[data-tab="family"].active { color: var(--accent); }
        
        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--mid-gray);
        }
        
        .loading-icon {
            font-size: 32px;
            margin-bottom: 8px;
            animation: pulse 1.5s ease infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .loading-text {
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Content Area -->
    <div class="content">
        <div class="tab-pane active" data-pane="dashboard">
            <div class="loading">
                <div class="loading-icon">📋</div>
                <div class="loading-text">Loading Dashboard...</div>
            </div>
            <iframe src="kristen.html" onload="this.previousElementSibling.style.display='none'"></iframe>
        </div>
        
        <div class="tab-pane" data-pane="lily">
            <div class="loading">
                <div class="loading-icon">🍼</div>
                <div class="loading-text">Loading Lily's Kitchen...</div>
            </div>
            <iframe data-src="https://tars-lo.github.io/lily-recipes/"></iframe>
        </div>
        
        <div class="tab-pane" data-pane="family">
            <div class="loading">
                <div class="loading-icon">🍳</div>
                <div class="loading-text">Loading Family Recipes...</div>
            </div>
            <iframe data-src="recipes.html"></iframe>
        </div>
    </div>
    
    <!-- Tab Bar -->
    <nav class="tab-bar">
        <div class="tab active" data-tab="dashboard" style="--tab-index: 0;">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Dashboard</span>
        </div>
        <div class="tab" data-tab="lily" style="--tab-index: 1;">
            <span class="tab-icon">🍼</span>
            <span class="tab-label">Lily</span>
        </div>
        <div class="tab" data-tab="family" style="--tab-index: 2;">
            <span class="tab-icon">🍳</span>
            <span class="tab-label">Family</span>
        </div>
    </nav>
    
    <script>
        (function() {
            const tabs = document.querySelectorAll('.tab');
            const panes = document.querySelectorAll('.tab-pane');
            
            // Lazy load iframes
            function loadPane(paneName) {
                const pane = document.querySelector(`[data-pane="${paneName}"]`);
                const iframe = pane.querySelector('iframe');
                if (iframe.dataset.src && !iframe.src) {
                    iframe.src = iframe.dataset.src;
                    iframe.onload = function() {
                        pane.querySelector('.loading').style.display = 'none';
                    };
                }
            }
            
            tabs.forEach((tab, index) => {
                tab.addEventListener('click', function() {
                    const targetTab = this.dataset.tab;
                    
                    // Update tabs
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update indicator position
                    document.documentElement.style.setProperty('--active-tab', index);
                    
                    // Update panes
                    panes.forEach(p => p.classList.remove('active'));
                    const targetPane = document.querySelector(`[data-pane="${targetTab}"]`);
                    targetPane.classList.add('active');
                    
                    // Lazy load
                    loadPane(targetTab);
                });
            });
            
            // Initial load of dashboard (already has src)
        })();
    </script>
</body>
</html>
